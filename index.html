<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>音読コーチ</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1218;
    --panel: #171c26;
    --panel-2: #1f2633;
    --line: #2b3446;
    --fg: #eef1f7;
    --muted: #98a2b6;
    --accent: #f2b544;
    --ok: #3ccf91;
    --ng: #ff6b6b;
    --font: "Noto Sans JP", "Hiragino Sans", "Yu Gothic UI", system-ui, sans-serif;
    --mono: ui-monospace, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.7; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 48px; display: grid; gap: 16px; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 14px; margin: 0; color: var(--muted); letter-spacing: .06em; }
  .lead { margin: 0; color: var(--muted); font-size: 13px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px; }
  textarea { width: 100%; min-height: 180px; background: var(--panel-2); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font: 16px/1.7 var(--font); resize: vertical; }
  .row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
  label { font-size: 13px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
  select, input[type=number] { background: var(--panel-2); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font: inherit; }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); color: var(--fg); padding: 10px 16px; }
  button.primary { background: var(--accent); color: #241800; border-color: var(--accent); font-weight: 700; }
  button.big { font-size: 18px; padding: 16px; width: 100%; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .hidden { display: none !important; }

  .progress { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
  .progress > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
  .meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); font-family: var(--mono); font-variant-numeric: tabular-nums; }

  .sentence { font-size: 26px; line-height: 1.8; text-wrap: pretty; padding: 18px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .sentence .w { padding: 0 2px; border-radius: 4px; }
  .sentence .w.ok { color: var(--ok); }
  .sentence .w.ng { color: var(--ng); background: rgba(255,107,107,.12); text-decoration: underline wavy var(--ng); text-underline-offset: 6px; }

  .status { min-height: 52px; padding: 12px 14px; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--line); font-size: 15px; }
  .status.pass { border-color: var(--ok); }
  .status.fail { border-color: var(--ng); }
  .heard { font-family: var(--mono); font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .pill { display: inline-block; padding: 1px 10px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); color: var(--muted); }
  .pill.pass { color: var(--ok); border-color: var(--ok); }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--accent); }

  .drill-word { font-size: 40px; text-align: center; padding: 18px; background: var(--panel); border: 1px solid var(--ng); border-radius: 10px; }
  .mic { position: relative; }
  .mic.live::after { content: "● 録音中"; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--ng); font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; }
  .weak { display: flex; flex-wrap: wrap; gap: 6px; }
  .weak span { background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 13px; }
  .weak b { color: var(--ng); font-family: var(--mono); font-weight: 500; margin-left: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>音読コーチ</h1>
    <p class="lead">読んだ声を判定し、合格するまで次に進めません。言えなかった語は、お手本を聞いて、1語ずつ言い直してから、文をもう一度読みます。</p>
  </header>

  <!-- 設定 -->
  <section id="setup" class="panel">
    <h2>読む文章（英語）</h2>
    <textarea id="text" placeholder="ここに英日記を貼ってください。1文ずつ読みます。"></textarea>
    <div class="row">
      <label>合格の正確さ
        <select id="threshold"><option value="0.75">75%</option><option value="0.85" selected>85%</option><option value="0.95">95%</option></select>
      </label>
      <label>1文あたりの合格回数
        <select id="passes"><option value="1">1回</option><option value="2" selected>2回</option><option value="3">3回</option></select>
      </label>
      <label>お手本の速さ
        <select id="rate"><option value="0.7">ゆっくり</option><option value="0.85" selected>ふつう</option><option value="1">はやい</option></select>
      </label>
    </div>
    <div id="weakBox" class="hidden"><h2>これまでの苦手な語</h2><div id="weakList" class="weak"></div></div>
    <button id="start" class="primary big">読み始める</button>
    <p class="lead" id="support"></p>
  </section>

  <!-- 練習 -->
  <section id="session" class="hidden" style="display:grid;gap:14px">
    <div class="progress"><i id="bar"></i></div>
    <div class="meta"><span id="pos">1 / 1</span><span id="passInfo"></span></div>
    <div id="sentence" class="sentence"></div>
    <div id="drill" class="hidden">
      <div class="drill-word" id="drillWord"></div>
    </div>
    <div id="status" class="status"></div>
    <div class="row" style="display:grid;gap:10px">
      <button id="listen" class="hidden">お手本を聞く</button>
      <button id="mic" class="primary big mic">マイクで読む</button>
      <button id="stop" class="big hidden">読み終わった</button>
    </div>
    <button id="quit" style="justify-self:end;font-size:13px;color:var(--muted)">中断する（未完了として記録）</button>
  </section>

  <!-- 結果 -->
  <section id="result" class="hidden panel">
    <h2>今日の結果</h2>
    <div id="summary"></div>
    <div id="resultWeak" class="weak"></div>
    <button id="again" class="primary big">もう一度</button>
  </section>
</div>

<script src="core.js"></script>
<script>
(function () {
  "use strict";
  const C = window.ReadAloudCore;
  const $ = (id) => document.getElementById(id);
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };

  const S = { sentences: [], idx: 0, passes: 0, need: 2, th: 0.85, rate: 0.85,
              attempts: [], weak: store.get("ra_weak", {}), started: 0, rec: null, busy: false };

  // ---------- 初期表示 ----------
  $("text").value = store.get("ra_text", "");
  $("threshold").value = store.get("ra_th", "0.85");
  $("passes").value = store.get("ra_passes", "2");
  $("rate").value = store.get("ra_rate", "0.85");
  if (!SR) $("support").textContent = "このブラウザは音声認識に対応していません。Chrome で開いてください。";
  else if (location.protocol !== "http:" && location.protocol !== "https:") $("support").textContent = "start.bat から開いてください（file:// ではマイクが使えません）。";
  renderWeak();

  function renderWeak() {
    const list = Object.entries(S.weak).sort((a, b) => b[1] - a[1]).slice(0, 12);
    $("weakBox").classList.toggle("hidden", list.length === 0);
    $("weakList").replaceChildren(...list.map(([w, n]) => {
      const e = document.createElement("span"); e.textContent = w;
      const b = document.createElement("b"); b.textContent = "×" + n; e.append(b); return e;
    }));
  }

  // ---------- 音声 ----------
  function speak(text, rate) {
    return new Promise((resolve) => {
      if (!("speechSynthesis" in window)) return resolve();
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US"; u.rate = rate;
      const v = speechSynthesis.getVoices().find((x) => /en[-_]US/i.test(x.lang));
      if (v) u.voice = v;
      u.onend = resolve; u.onerror = resolve;
      speechSynthesis.speak(u);
      setTimeout(resolve, 30000);
    });
  }

  // 認識を始める。stop() で止めると、集めた候補を返す
  function listen(opts) {
    return new Promise((resolve, reject) => {
      const rec = new SR();
      rec.lang = "en-US"; rec.interimResults = false; rec.maxAlternatives = 5;
      rec.continuous = !!opts.continuous;
      const segments = [];
      let silence = null, gotSpeech = false, t0 = 0, done = false;
      const finish = (err) => {
        if (done) return; done = true; clearTimeout(silence); S.rec = null;
        if (err) reject(err); else resolve({ segments, ms: gotSpeech ? performance.now() - t0 : 0 });
      };
      rec.onresult = (e) => {
        for (let i = e.resultIndex; i < e.results.length; i++) {
          if (!e.results[i].isFinal) continue;
          const alts = []; for (let k = 0; k < e.results[i].length; k++) alts.push(e.results[i][k].transcript);
          segments.push(alts);
        }
        if (opts.continuous) { clearTimeout(silence); silence = setTimeout(() => rec.stop(), 2500); }
      };
      rec.onspeechstart = () => { if (!gotSpeech) { gotSpeech = true; t0 = performance.now(); } };
      rec.onerror = (e) => { if (e.error === "no-speech" || e.error === "aborted") finish(); else finish(new Error(e.error)); };
      rec.onend = () => finish();
      S.rec = rec;
      try { rec.start(); } catch (e) { finish(e); }
    });
  }

  // 文全体の候補: 区間ごとの第1候補をつなげたもの + 区間ごとの全候補をつなげた複数案
  function alternativesOf(segments) {
    if (!segments.length) return [""];
    const alts = [];
    for (let k = 0; k < 5; k++) alts.push(segments.map((s) => s[Math.min(k, s.length - 1)]).join(" "));
    return alts;
  }

  // ---------- 画面の切り替え ----------
  function show(id) { for (const x of ["setup", "session", "result"]) $(x).classList.toggle("hidden", x !== id); if (id === "session") $("session").style.display = "grid"; }
  function setStatus(html, cls) { const s = $("status"); s.className = "status" + (cls ? " " + cls : ""); s.innerHTML = html; }
  function esc(t) { const d = document.createElement("div"); d.textContent = t; return d.innerHTML; }

  function renderSentence(words) {
    const el = $("sentence");
    if (!words) { el.textContent = S.sentences[S.idx]; return; }
    el.replaceChildren(...words.flatMap((w, i) => {
      const s = document.createElement("span"); s.className = "w " + (w.ok ? "ok" : "ng"); s.textContent = w.raw;
      return i ? [document.createTextNode(" "), s] : [s];
    }));
  }

  function renderProgress() {
    $("pos").textContent = (S.idx + 1) + " / " + S.sentences.length;
    $("passInfo").textContent = "合格 " + S.passes + " / " + S.need + "（正確さ " + Math.round(S.th * 100) + "% 以上）";
    $("bar").style.width = (S.idx / S.sentences.length * 100) + "%";
  }

  function setControls(mode) {
    // mode: ready / listening / locked / drill
    $("mic").classList.toggle("hidden", mode === "listening");
    $("mic").classList.remove("live");
    $("stop").classList.toggle("hidden", mode !== "listening");
    $("listen").classList.toggle("hidden", mode === "locked" || mode === "listening");
    $("mic").disabled = mode === "locked";
    $("listen").disabled = mode === "locked";
  }

  // ---------- 開始 ----------
  $("start").addEventListener("click", () => {
    const sentences = C.splitSentences($("text").value);
    if (!sentences.length) { alert("読む文章を貼ってください。"); return; }
    if (!SR) { alert("Chrome で開いてください。"); return; }
    S.sentences = sentences; S.idx = 0; S.passes = 0; S.attempts = [];
    S.need = +$("passes").value; S.th = +$("threshold").value; S.rate = +$("rate").value;
    store.set("ra_text", $("text").value); store.set("ra_th", $("threshold").value);
    store.set("ra_passes", $("passes").value); store.set("ra_rate", $("rate").value);
    S.started = Date.now(); S.completed = false;
    show("session"); beginSentence();
  });

  function beginSentence() {
    renderSentence(); renderProgress(); $("drill").classList.add("hidden"); $("sentence").classList.remove("hidden");
    setControls("ready");
    setStatus(S.passes === 0 ? "「マイクで読む」を押して、この文を声に出して読んでください。読み終わったら止まるまで待つか、「読み終わった」を押します。"
                             : "もう一度読んでください。あと <span class='num'>" + (S.need - S.passes) + "</span> 回合格すると次に進めます。");
  }

  $("listen").addEventListener("click", async () => {
    setControls("locked"); setStatus("お手本を再生しています…");
    await speak(S.sentences[S.idx], S.rate);
    setControls("ready"); setStatus("読んでください。");
  });

  // ---------- 文を読む ----------
  $("mic").addEventListener("click", async () => {
    if (S.busy) return; S.busy = true;
    setControls("listening"); setStatus("聞いています。読み終わったら「読み終わった」を押してください。");
    let res;
    try { res = await listen({ continuous: true }); }
    catch (e) { S.busy = false; setControls("ready"); setStatus(errText(e), "fail"); return; }
    S.busy = false;
    if (!res.segments.length) { setControls("ready"); setStatus("声が聞こえませんでした。もう一度読んでください。", "fail"); return; }
    await judgeSentence(res);
  });
  $("stop").addEventListener("click", () => { if (S.rec) S.rec.stop(); });

  function errText(e) {
    const m = String(e && (e.message || e));
    if (/not-allowed|service-not-allowed/.test(m)) return "マイクが許可されていません。アドレスバーの鍵の表示から、マイクを許可してください。";
    if (/network/.test(m)) return "音声認識に接続できません。ネットワークを確認してください。";
    return "うまく聞き取れませんでした（" + esc(m) + "）。もう一度どうぞ。";
  }

  async function judgeSentence(res) {
    const sentence = S.sentences[S.idx];
    const alts = alternativesOf(res.segments);
    const r = C.judge(sentence, alts);
    const nWords = r.words.length;
    const wpm = res.ms > 0 ? Math.round(nWords / (res.ms / 60000)) : 0;
    renderSentence(r.words);
    const pct = Math.round(r.accuracy * 100);
    S.attempts.push({ sentence, accuracy: r.accuracy, missed: r.missed, wpm });
    const heard = "<div class='heard'>聞こえた内容: " + esc(r.heard || "（なし）") + "</div>";
    if (r.accuracy >= S.th) {
      S.passes++;
      setStatus("<span class='pill pass'>合格</span> 正確さ <span class='num'>" + pct + "%</span> ・ 速さ <span class='num'>" + wpm + "</span> 語/分" + heard, "pass");
      setControls("locked"); renderProgress();
      await new Promise((ok) => setTimeout(ok, 1500));
      if (S.passes >= S.need) { S.idx++; S.passes = 0; if (S.idx >= S.sentences.length) return finish(true); }
      beginSentence();
    } else {
      S.passes = 0; renderProgress();
      r.missed.forEach((w) => { const k = C.normalize(w); S.weak[k] = (S.weak[k] || 0) + 1; });
      store.set("ra_weak", S.weak);
      setStatus("<span class='pill'>不合格</span> 正確さ <span class='num'>" + pct + "%</span>。合格の回数は 0 に戻ります。まず、お手本を聞きます。" + heard, "fail");
      setControls("locked");
      await new Promise((ok) => setTimeout(ok, 1200));
      await speak(sentence, S.rate);
      await drillWords(r.missed);
      beginSentence();
    }
  }

  // ---------- 間違えた語を1語ずつ ----------
  async function drillWords(missed) {
    const uniq = [...new Set(missed)];
    $("sentence").classList.add("hidden"); $("drill").classList.remove("hidden");
    for (let i = 0; i < uniq.length; i++) {
      const w = uniq[i];
      $("drillWord").textContent = w;
      let ok = false;
      while (!ok) {
        setControls("locked"); setStatus("<span class='num'>" + (i + 1) + " / " + uniq.length + "</span> 語目。お手本を聞きます。");
        await speak(w.replace(/[-]/g, " "), 0.7);
        setControls("listening"); $("stop").classList.add("hidden");
        setStatus("この語を声に出してください。");
        try {
          const res = await listen({ continuous: false });
          const alts = res.segments.flat();
          ok = alts.length > 0 && C.judgeWord(w, alts);
          if (!ok) { setStatus("<span class='pill'>もう一度</span> 聞こえた内容: " + esc(alts[0] || "（なし）"), "fail"); await new Promise((r) => setTimeout(r, 1300)); }
        } catch (e) { setStatus(errText(e), "fail"); await new Promise((r) => setTimeout(r, 1500)); }
      }
      setStatus("<span class='pill pass'>OK</span> " + esc(w), "pass");
      await new Promise((r) => setTimeout(r, 700));
    }
    $("drill").classList.add("hidden"); $("sentence").classList.remove("hidden");
    renderSentence();
  }

  // ---------- 終了 ----------
  $("quit").addEventListener("click", () => { if (confirm("中断すると、未完了として記録されます。")) { if (S.rec) { try { S.rec.abort(); } catch {} } speechSynthesis.cancel(); finish(false); } });

  function finish(completed) {
    const hist = store.get("ra_history", []);
    const acc = S.attempts.length ? S.attempts.reduce((a, x) => a + x.accuracy, 0) / S.attempts.length : 0;
    const entry = { ts: Date.now(), sentences: S.sentences.length, done: S.idx, attempts: S.attempts.length, accuracy: acc, completed, sec: Math.round((Date.now() - S.started) / 1000) };
    hist.push(entry); store.set("ra_history", hist.slice(-200));
    $("bar").style.width = "100%";
    const wpms = S.attempts.map((a) => a.wpm).filter(Boolean);
    const avgWpm = wpms.length ? Math.round(wpms.reduce((a, b) => a + b, 0) / wpms.length) : 0;
    $("summary").innerHTML =
      "<p>" + (completed ? "全部の文で合格しました。" : "<b style='color:var(--ng)'>途中で中断しました（未完了）。</b>") + "</p>" +
      "<table><tr><th>文の数</th><td><span class='num'>" + S.idx + " / " + S.sentences.length + "</span></td></tr>" +
      "<tr><th>読んだ回数</th><td><span class='num'>" + S.attempts.length + "</span></td></tr>" +
      "<tr><th>平均の正確さ</th><td><span class='num'>" + Math.round(acc * 100) + "%</span></td></tr>" +
      "<tr><th>平均の速さ</th><td><span class='num'>" + avgWpm + "</span> 語/分</td></tr>" +
      "<tr><th>かかった時間</th><td><span class='num'>" + Math.floor(entry.sec / 60) + "分" + (entry.sec % 60) + "秒</span></td></tr></table>";
    const miss = {}; S.attempts.forEach((a) => a.missed.forEach((w) => { const k = C.normalize(w); miss[k] = (miss[k] || 0) + 1; }));
    const list = Object.entries(miss).sort((a, b) => b[1] - a[1]);
    $("resultWeak").replaceChildren(...list.map(([w, n]) => { const e = document.createElement("span"); e.textContent = w; const b = document.createElement("b"); b.textContent = "×" + n; e.append(b); return e; }));
    renderWeak(); show("result");
  }
  $("again").addEventListener("click", () => show("setup"));
})();
</script>
</body>
</html>
